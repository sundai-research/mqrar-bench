[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mqrar-bench"
version = "0.1.0"
description = "Benchmark suite for MQRAR (Multi-Query Retrieval-Augmented Reasoning) models"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.5.0",
    "triton>=3.0.0",
    "einops>=0.8.0",
    "tqdm>=4.66.0",
    "flash-linear-attention>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["models*", "examples*"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true